  <title>Square Hole</title>
  <desc>Square Hole horizontal lockup, for white and light backgrounds</desc>
  <svg x="0" y="0" width="256" height="256" viewBox="0 0 256 256"><defs>
    <linearGradient id="shm-face" x1="0" y1="0" x2="0" y2="1">
